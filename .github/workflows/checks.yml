name: Offline and isolated database checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements.lock'
      - run: python scripts/test_offline.py
      - run: python -m pip check
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: worldcup_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U synthetic -d worldcup_test_ci'
          --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements.lock'
      - name: Synthetic loopback PostgreSQL transactions
        env:
          WORLDCUP_RUN_PG_TESTS: '1'
          WORLDCUP_TEST_DATABASE_URL: postgresql://synthetic:synthetic-ci-only@127.0.0.1:5432/worldcup_test_ci
        run: python -m unittest discover -s tests -p test_postgres_integration.py -v
