services:
  - type: web
    name: worldcup-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: WORLDCUP_BOT_TOKEN
        sync: false
      - key: WORLDCUP_ALLOWED_CHAT_IDS
        sync: false
      - key: WORLDCUP_ADMIN_USER_IDS
        sync: false
      - key: WORLDCUP_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
