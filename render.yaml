services:
  - type: web
    name: worldcup-bot
    runtime: python
    plan: free
    buildCommand: pip install --only-binary=:all: --require-hashes -r requirements.lock
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: WORLDCUP_MODE
        value: webhook
      - key: WORLDCUP_BOT_TOKEN
        sync: false
      - key: WORLDCUP_ALLOWED_CHAT_IDS
        sync: false
      - key: WORLDCUP_ADMIN_USER_IDS
        sync: false
      - key: WORLDCUP_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
